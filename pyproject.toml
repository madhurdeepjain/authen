[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authen"
version = "0.1.0"
description = "Academic reference validation pipeline - extract, parse, validate, and export references"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "your@email.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # PDF Processing
    "pdfplumber>=0.10.0",

    # LLM Providers
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0", # Google Gemini

    # Async & HTTP
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "aiolimiter>=1.1.0",

    # Data Processing
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",

    # Text Processing
    "rapidfuzz>=3.0.0", # For fuzzy matching/similarity

    # UI
    "streamlit>=1.30.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",      # Retry logic
    "tqdm>=4.65.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
local-llm = ["ollama>=0.1.0"]

[project.scripts]
authen = "authen.cli:main"
authen-ui = "authen.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
